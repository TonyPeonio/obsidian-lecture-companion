name: E2E (real Obsidian)

# End-to-end tests in a real Obsidian downloaded by wdio-obsidian-service: course-note migration,
# course rename, clickable timestamps, the sample lecture and importing a note. Separate from the
# release gate (CI + Release), so a flaky desktop session never blocks a release.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Cache Obsidian downloads
        uses: actions/cache@v4
        with:
          path: .obsidian-cache
          # Keyed on the test tooling, not the plugin version, so a release does not re-download Obsidian.
          key: obsidian-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: node esbuild.config.mjs production
      - name: Run e2e tests under a virtual display
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1280x1024x24" npx wdio run ./wdio.conf.mts 2>&1 | tee e2e.log
      # Raw job logs need a GitHub sign-in; annotations are public, so a failure is readable on the run page.
      - name: Report failures as annotations
        if: failure()
        run: |
          grep -v '^\s*at ' e2e.log | cut -c1-300 | grep -iE -B3 -A15 'error|fail|✖|expect' | tail -c 30000 > e2e-failures.txt || true
          body=$(sed -e 's/%/%25/g' e2e-failures.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=E2E output::${body}"
