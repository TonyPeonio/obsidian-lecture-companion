name: Release

# Builds the plugin from source on a version tag (e.g. `0.1.1`), attests the provenance
# of the artifacts, and publishes a GitHub release with the three files Obsidian installs.
#
# Beta channel: a tag like `0.3.1-beta.1` must match `manifest-beta.json` (manifest.json keeps the
# stable version, so the community store never offers a beta). The release is marked as a
# pre-release and its manifest.json asset is manifest-beta.json, which is what BRAT installs.
# The Obsidian community directory rebuilds the plugin from the lockfile and compares it
# with the release asset, so releases must come from here, not from a local build.

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Check that the tag matches the manifest
        run: |
          case "${GITHUB_REF_NAME}" in
            *-*)
              version=$(node -p "require('./manifest-beta.json').version")
              if [ "$version" != "${GITHUB_REF_NAME}" ]; then
                echo "manifest-beta.json version ($version) does not match tag (${GITHUB_REF_NAME})" >&2
                exit 1
              fi
              # The beta's manifest is the one attached to the release (and installed by BRAT).
              cp manifest-beta.json manifest.json
              echo "PRERELEASE=--prerelease" >> "$GITHUB_ENV"
              ;;
            *)
              version=$(node -p "require('./manifest.json').version")
              if [ "$version" != "${GITHUB_REF_NAME}" ]; then
                echo "manifest.json version ($version) does not match tag (${GITHUB_REF_NAME})" >&2
                exit 1
              fi
              ;;
          esac

      - run: npm test

      - run: npm run build

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$notes" ]; then
            gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
              --title "${GITHUB_REF_NAME}" --notes-file "$notes" $PRERELEASE
          else
            gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
              --title "${GITHUB_REF_NAME}" --generate-notes $PRERELEASE
          fi
